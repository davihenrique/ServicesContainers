name: Deploy composes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    # Plain Alpine, no node: no actions (uses:) are used, shell only
    container:
      image: alpine:3.22
    defaults:
      run:
        shell: sh
    outputs:
      yaml: ${{ steps.changes.outputs.yaml }}
      deploy: ${{ steps.changes.outputs.deploy }}
      delete: ${{ steps.changes.outputs.delete }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache git yamllint

      # Manual checkout (replaces actions/checkout, which needs node).
      # Kept inline because the scripts only exist after the checkout.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')

          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraHeader "Authorization: Basic $AUTH"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
              "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          else
            git fetch -q --no-tags origin "+${{ github.ref }}:refs/remotes/origin/current"
          fi

          git checkout -q --detach "${{ github.sha }}"
          git config --unset http.extraHeader
          git log -1 --oneline

      - name: Detect changed files
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh .gitea/scripts/detect-changes.sh

      - name: Lint YAML
        if: steps.changes.outputs.yaml != ''
        run: sh .gitea/scripts/lint-yaml.sh ${{ steps.changes.outputs.yaml }}

  # Syncs the files with the server and recreates the changed services (push/manual only, never on PRs)
  deploy:
    name: Deploy to server
    needs: validate
    if: github.event_name != 'pull_request' && (needs.validate.outputs.deploy != '' || needs.validate.outputs.delete != '')
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    defaults:
      run:
        shell: sh
    env:
      FILES: ${{ needs.validate.outputs.deploy }}
      DELETE: ${{ needs.validate.outputs.delete }}
      DEST_DIR: ${{ vars.DEST_DIR || '/opt' }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache git openssh-client

      # Same checkout as the validate job, but shallow: the files of this commit are enough here
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')

          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraHeader "Authorization: Basic $AUTH"
          git fetch -q --no-tags --depth 1 origin "${{ github.sha }}"
          git checkout -q --detach FETCH_HEAD
          git config --unset http.extraHeader

      # Before the sync: a deleted compose file can no longer stop its containers
      - name: Stop removed services
        run: sh .gitea/scripts/stop-removed.sh

      - name: Sync files
        run: sh .gitea/scripts/sync-files.sh

      - name: Restart changed services
        run: sh .gitea/scripts/restart-changed.sh
