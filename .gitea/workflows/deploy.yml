name: Deploy composes

on:
  push:
    branches: [main]
    paths: ["**.yml", "**.yaml"]
  pull_request:
    paths: ["**.yml", "**.yaml"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    # Plain Alpine, no node: no actions (uses:) are used, shell only
    container:
      image: alpine:3.22
    defaults:
      run:
        shell: sh
    outputs:
      changed: ${{ steps.changes.outputs.files }}
      composes: ${{ steps.changes.outputs.composes }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache git yamllint

      # Manual checkout (replaces actions/checkout, which needs node).
      # Kept inline because the scripts only exist after the checkout.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')

          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraHeader "Authorization: Basic $AUTH"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
              "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          else
            git fetch -q --no-tags origin "+${{ github.ref }}:refs/remotes/origin/current"
          fi

          git checkout -q --detach "${{ github.sha }}"
          git config --unset http.extraHeader
          git log -1 --oneline

      - name: Detect changed files
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh .gitea/scripts/detect-changes.sh

      - name: Lint YAML
        if: steps.changes.outputs.files != ''
        run: sh .gitea/scripts/lint-yaml.sh ${{ steps.changes.outputs.files }}

  # Writes the list of changed composes to the server (push/manual only, never on PRs)
  publish:
    name: Publish changed composes
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    defaults:
      run:
        shell: sh
    steps:
      - name: Install dependencies
        run: apk add --no-cache git openssh-client

      # Same checkout as the validate job, but shallow: only the scripts are needed here
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')

          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraHeader "Authorization: Basic $AUTH"
          git fetch -q --no-tags --depth 1 origin "${{ github.sha }}"
          git checkout -q --detach FETCH_HEAD
          git config --unset http.extraHeader

      - name: Write list to server
        env:
          COMPOSES: ${{ needs.validate.outputs.composes }}
          OUTPUT_FILE: ${{ vars.OUTPUT_FILE || '/opt/deploy/changed-composes.txt' }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: sh .gitea/scripts/publish-changes.sh
