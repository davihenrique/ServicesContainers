name: Validate YAML

on:
  push:
    branches: [main]
    paths: ["**.yml", "**.yaml"]
  pull_request:
    paths: ["**.yml", "**.yaml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Alpine puro, sem node: nenhuma action (uses:) é usada, só shell
    container:
      image: alpine:3.22
    defaults:
      run:
        shell: sh
    outputs:
      changed: ${{ steps.changed.outputs.files }}
    steps:
      - name: Instalar dependências
        run: apk add --no-cache git yamllint

      # Checkout manual (substitui actions/checkout, que exige node)
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')

          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git config http.extraHeader "Authorization: Basic $AUTH"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" \
              "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/head"
          else
            git fetch -q --no-tags origin "+${{ github.ref }}:refs/remotes/origin/current"
          fi

          git checkout -q --detach "${{ github.sha }}"
          git config --unset http.extraHeader
          git log -1 --oneline

      - name: Identificar arquivos .yml alterados
        id: changed
        run: |
          ZERO="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          # Disparo manual, primeiro push ou commit base inexistente: considera todos os arquivos
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sem commit base - considerando todos os arquivos .yml/.yaml"
            git ls-files '*.yml' '*.yaml' > changed.txt
          else
            echo "Comparando $BASE...${{ github.sha }}"
            git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- '*.yml' '*.yaml' > changed.txt
          fi

          echo "Arquivos alterados:"
          if [ -s changed.txt ]; then
            sed 's/^/  - /' changed.txt
          else
            echo "  (nenhum)"
          fi

          # Lista separada por espaço para os próximos jobs/steps
          echo "files=$(tr '\n' ' ' < changed.txt | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

      - name: Validar sintaxe YAML
        if: steps.changed.outputs.files != ''
        run: |
          # relaxed: falha apenas em erros reais de sintaxe/estrutura; estilo vira aviso
          yamllint -f colored \
            -d '{extends: relaxed, rules: {line-length: disable}}' \
            ${{ steps.changed.outputs.files }}
