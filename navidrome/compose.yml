# Navidrome
services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    container_name: navidrome
    restart: always
    ports:
      - "4533:4533"
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANSCHEDULE=1h
      - ND_SESSIONTIMEOUT=24h
      - ND_ENABLETRANSCODINGCONFIG=true
      # Last.fm: capas/biografias de artistas e scrobble.
      # Chaves no .env, gerado pelo deploy a partir do secret ENV_NAVIDROME do Gitea.
      - ND_LASTFM_ENABLED=true
      - ND_LASTFM_APIKEY=${LASTFM_APIKEY}
      - ND_LASTFM_SECRET=${LASTFM_SECRET}
      - ND_LASTFM_LANGUAGE=pt
    volumes:
      - ./data:/data:z
      - ./cache:/data/cache:z
      - "/srv/nextcloud/davi/files/Músicas:/music:ro"
