# Navidrome
services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    container_name: navidrome
    restart: always
    ports:
      - "4533:4533"
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANSCHEDULE=1h
      - ND_SESSIONTIMEOUT=24h
      - ND_ENABLETRANSCODINGCONFIG=true
    volumes:
      - ./data:/data:z
      - ./cache:/data/cache:z
      - "/srv/nextcloud/davi/files/Músicas:/music:ro"
