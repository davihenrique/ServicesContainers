services:
  qbittorrent:
    image: docker.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    environment:
      - PUID=33
      - PGID=33
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
      # Usuário e senha do WebUI, aplicados pelo custom-cont-init.d. Vêm do .env, gerado
      # pelo deploy a partir dos secrets QBT_WEBUI_USERNAME e QBT_WEBUI_PASSWORD do Gitea.
      - QBT_WEBUI_USERNAME=${QBT_WEBUI_USERNAME:-}
      - QBT_WEBUI_PASSWORD=${QBT_WEBUI_PASSWORD:-}
    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./config:/config:z
      # Um único volume para incomplete/ e complete/: assim a mudança de pasta
      # ao terminar o download é um rename atômico (com dois volumes separados
      # o qBittorrent precisa copiar + apagar, e o script poderia pegar arquivo pela metade).
      - ./downloads:/downloads:z
      # Scripts executados a cada start: configuram pastas e o hook de torrent concluído.
      - ./custom-cont-init.d:/custom-cont-init.d:ro,z
