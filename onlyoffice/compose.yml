services:
  onlyoffice:
    image: docker.io/onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: always
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=cca697ad3b1abd90802d25d9395b8cabb01ffa0fe9128c01701df58e4a7c5097
      - JWT_HEADER=Authorization
    volumes:
      - ./data:/var/www/onlyoffice/Data:z
      - ./log:/var/log/onlyoffice:z
      - ./lib:/var/lib/onlyoffice:z
      - ./db:/var/lib/postgresql:z
