services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:next
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data:U,Z
      # Podman socket exposed as the Docker socket, for the container monitors
      - /run/podman/podman.sock:/var/run/docker.sock
